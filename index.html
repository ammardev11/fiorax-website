<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FioraX Studio | Digital Sovereignty</title>
  <link rel="icon" type="image/svg-cml" href="/assets/logo-DC-YyKaS.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#050505",
            surface: "#09090B",
            primary: "#CCFF00",
            secondary: "#FFFFFF",
            muted: "#94A3B8",
            "glass-border": "rgba(255,255,255,0.1)",
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            arabic: ['Almarai', 'sans-serif'],
          },
          backgroundImage: {
            'noise': "url('https://grainy-gradients.vercel.app/noise.svg')",
          },
          animation: {
            'blob': 'blob 10s infinite',
            'scroll': 'scroll 40s linear infinite',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            scroll: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' },
            }
          }
        },
      },
    }
  </script>
  <style>
    body {
      background-color: #050505;
      color: #FFFFFF;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .text-glow {
      text-shadow: 0 0 20px rgba(204, 255, 0, 0.3);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #CCFF00;
    }
  </style>

  <link rel="stylesheet" href="/index.css">

  "imports": {

    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.33.0"
  }
}
</script>
  <script type="module" crossorigin src="/assets/index-BDq__Qlk.js"></script>
</head>

</body>

</html>
